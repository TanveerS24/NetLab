name: Authentication Tests

on:
  push:
    branches:
      - main
      - master
    paths:
      - "server/services/authService/**"
      - "server/middleware/auth.middleware.js"
      - "server/routes/auth.route.js"
      - "server/routes/auth.routes.js"
      - "server/models/user.model.js"
      - "tests/**"
      - ".github/workflows/auth-tests.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "server/services/authService/**"
      - "server/middleware/auth.middleware.js"
      - "server/routes/auth.route.js"
      - "server/routes/auth.routes.js"
      - "server/models/user.model.js"
      - "tests/**"
      - ".github/workflows/auth-tests.yml"
      - "package.json"
      - "package-lock.json"

jobs:
  auth-tests:
    name: Run Authentication Test Suite
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      ACCESS_TOKEN_SECRET: test_ci_access_token_secret_key_123456789
      REFRESH_TOKEN_SECRET: test_ci_refresh_token_secret_key_987654321

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Authentication Tests
        run: npm run test:auth
